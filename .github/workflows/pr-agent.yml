name: PR-Agent review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request && github.event.comment.body == '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PR-Agent fetches the diff through the API. Do not check out or execute PR code.
      - name: Review the pull request
        uses: docker://pragent/pr-agent@sha256:548b760b81ab4b3f729182428695ccc1194bbf87528c2b1e2b2b07e5223af7b6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.PR_AGENT_OPENAI_KEY }}
          CONFIG.MODEL: gpt-5.6-luna
          CONFIG.MODEL_WEAK: gpt-5.6-luna
          CONFIG.FALLBACK_MODELS: '["gpt-5.6-luna"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: '32000'
          CONFIG.MAX_MODEL_TOKENS: '10000'
          CONFIG.MAX_OUTPUT_TOKENS: '2000'
          CONFIG.USE_REPO_SETTINGS_FILE: 'false'
          CONFIG.USE_GLOBAL_SETTINGS_FILE: 'false'
          CONFIG.OUTPUT_RUN_DETAILS: 'true'
          CONFIG.PUBLISH_OUTPUT_PROGRESS: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "synchronize", "ready_for_review"]'
